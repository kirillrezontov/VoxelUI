name: Build and test
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, config: Debug }
          - { os: ubuntu-latest, config: Release }
          - { os: windows-latest, config: Debug }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned dependency registry
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d186940b2f0c4e8e5b4ff804af57d2a26fbfa091
          path: vcpkg
      - name: Bootstrap (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: cmake -S . -B out -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVOXELUI_PREVIEW_SDL=OFF
      - name: Build
        run: cmake --build out --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir out -C ${{ matrix.config }} --output-on-failure
      - name: Installed public API consumer
        run: |
          cmake --install out --config ${{ matrix.config }} --prefix stage
          cmake -S tests/consumer -B consumer -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DVOXELUI_EXPECT_IMPORTED_CONFIG=${{ matrix.config }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/out/vcpkg_installed -DVCPKG_MANIFEST_DIR=${{ github.workspace }}
          cmake --build consumer --config ${{ matrix.config }} --parallel 2
          ctest --test-dir consumer -C ${{ matrix.config }} --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libxml2-dev libfreetype-dev libpng-dev
      - run: cmake --preset asan && cmake --build --preset asan --parallel 2 && ctest --preset asan
  native-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build glslc libvulkan-dev libxml2-dev libfreetype-dev libpng-dev
      - run: cmake -S . -B out/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOXELUI_PREVIEW_SDL=OFF -DVOXELUI_VULKAN=ON
      - run: cmake --build out/native --parallel 2
      # Hardware conformance is a separate explicitly dispatched job.
      - run: ctest --test-dir out/native -LE graphics --output-on-failure
