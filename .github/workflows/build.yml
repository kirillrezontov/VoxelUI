name: Build and test
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned dependency registry
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d186940b2f0c4e8e5b4ff804af57d2a26fbfa091
          path: vcpkg
      - name: Bootstrap (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: cmake -S . -B out -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVOXELUI_PREVIEW_SDL=OFF
      - name: Build
        run: cmake --build out --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir out -C Debug --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libxml2-dev libfreetype-dev libpng-dev
      - run: cmake --preset asan && cmake --build --preset asan --parallel 2 && ctest --preset asan
